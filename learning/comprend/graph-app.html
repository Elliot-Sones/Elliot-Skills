<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Comprend brain</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d10; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; overflow: hidden; }
  #net { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 10; background: rgba(17, 20, 25, 0.92); border: 1px solid #23262d;
           border-radius: 10px; color: #c8cdd6; font-size: 13px; backdrop-filter: blur(6px); }
  #controls { top: 14px; left: 14px; padding: 12px 14px; width: 210px; }
  #stats { top: 14px; right: 14px; padding: 8px 12px; }
  #route { bottom: 14px; left: 14px; width: 300px; max-height: 52vh; display: none; flex-direction: column; }
  #route-head { padding: 12px 14px 8px; border-bottom: 1px solid #23262d; }
  #route-head b { color: #F8FAFC; font-size: 13.5px; }
  #route-close { float: right; color: #8b93a1; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
  #route-close:hover { color: #F8FAFC; background: #272F42; }
  #route-steps { overflow-y: auto; padding: 6px 6px 10px; }
  .step { padding: 5px 9px; border-radius: 7px; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  .step:hover, .step.hovered { background: #1E293B; }
  .step.current { background: #272F42; color: #F8FAFC; }
  .step:focus-visible { outline: 2px solid #7aa2f7; outline-offset: -2px; }
  .step .n { color: #8b93a1; font-variant-numeric: tabular-nums; min-width: 2em; }
  .step.done .n, .step.done { color: #4ade80; }
  #search { width: 100%; box-sizing: border-box; padding: 6px 9px; border-radius: 7px; border: 1px solid #2c303a;
            background: #14171c; color: #F8FAFC; outline: none; margin-bottom: 4px; }
  #search:focus { border-color: #7aa2f7; }
  .hint { color: #8b93a1; font-size: 11px; margin-bottom: 8px; }
  .row { display: flex; align-items: center; gap: 7px; margin: 4px 0; cursor: pointer; user-select: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .muted { color: #8b93a1; }
  .grp { margin-top: 9px; padding-top: 8px; border-top: 1px solid #23262d; }
  input[type="checkbox"], input[type="radio"] { accent-color: #7aa2f7; }
  #live { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: inline-block; margin-right: 6px; }
</style>
</head>
<body>
<div id="net"></div>
<div id="controls" class="panel">
  <input id="search" placeholder="find concept, press Enter" />
  <div class="hint">prefix with <b>path:</b> for route to a topic</div>
  <div class="grp">
    <label class="row"><input type="checkbox" id="f-ready"> <span class="dot" style="background:#7aa2f7"></span> spotlight ready-to-learn</label>
  </div>
  <div class="grp"><span class="muted">color by</span>
    <label class="row"><input type="radio" name="cmode" value="area" checked> area</label>
    <label class="row"><input type="radio" name="cmode" value="status"> my status</label>
  </div>
  <div class="grp"><span class="muted">show</span>
    <label class="row"><input type="checkbox" id="f-known" checked> <span class="dot" style="background:#4ade80"></span> known</label>
    <label class="row"><input type="checkbox" id="f-learning" checked> <span class="dot" style="background:#fbbf24"></span> learning</label>
    <label class="row"><input type="checkbox" id="f-shaky" checked> <span class="dot" style="background:#fb923c"></span> shaky</label>
    <label class="row"><input type="checkbox" id="f-unknown" checked> <span class="dot" style="background:#3a3f4b"></span> not yet</label>
  </div>
</div>
<div id="stats" class="panel"><span id="live"></span><span id="counts">loading...</span></div>
<div id="route" class="panel">
  <div id="route-head"></div>
  <div id="route-steps"></div>
</div>
<script>
const AREA_COLORS = ["#7aa2f7","#9ece6a","#e0af68","#bb9af7","#7dcfff","#f7768e","#73daca","#c0caf5","#c678dd","#2ac3de","#f2a5c1"];
const STATUS_COLORS = { known: "#4ade80", learning: "#fbbf24", shaky: "#fb923c", unknown: "#3a3f4b" };
const DIM = 0.08;
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const ANIM = RM ? false : { duration: 500, easingFunction: "easeInOutQuad" };
let areas = [], aliases = {}, raw = { nodes: [], edges: [] }, cmode = "area", positions = {};
let route = { active: false, order: [], target: null, cursor: -1, trail: [] };
const LEVEL_DX = 190, VSPACE = 60;

// Map mode is a computed curriculum board, not a simulation: x = prerequisite
// depth (roots left, frontier right), y = even spacing within the column,
// grouped by area. Deterministic, stable, overlap-free.
function computePositions(d) {
  const parents = {};
  d.edges.forEach(e => { (parents[e.to] = parents[e.to] || []).push(e.from); });
  const memo = {};
  const depth = id => {
    if (memo[id] !== undefined) return memo[id];
    memo[id] = 0;
    const ps = parents[id] || [];
    memo[id] = ps.length ? 1 + Math.max(...ps.map(depth)) : 0;
    return memo[id];
  };
  d.nodes.forEach(n => depth(n.id));
  const cols = {};
  d.nodes.forEach(n => { (cols[memo[n.id]] = cols[memo[n.id]] || []).push(n); });
  const pos = {};
  Object.entries(cols).forEach(([lvl, members]) => {
    members.sort((a, b) => (areas.indexOf(a.area) - areas.indexOf(b.area)) || a.id.localeCompare(b.id));
    members.forEach((n, i) => {
      pos[n.id] = { x: lvl * LEVEL_DX, y: (i - (members.length - 1) / 2) * VSPACE };
    });
  });
  return pos;
}
const nodes = new vis.DataSet([]), edges = new vis.DataSet([]);

const net = new vis.Network(document.getElementById("net"), { nodes, edges }, {
  physics: { enabled: false },
  nodes: {
    shape: "dot", borderWidth: 1.5,
    font: { color: "#c8cdd6", size: 12, strokeWidth: 0 },
    scaling: { label: { enabled: true, min: 9, max: 22, drawThreshold: 4 } },
  },
  edges: {
    width: 1, smooth: false,
    color: { color: "rgba(150,160,180,0.14)", highlight: "rgba(255,255,255,0.55)", hover: "rgba(255,255,255,0.3)" },
    arrows: { to: { enabled: true, scaleFactor: 0.3 } },
  },
  interaction: { hover: true, tooltipDelay: 120, dragNodes: true },
});

function fillFor(n) {
  if (cmode === "status") return STATUS_COLORS[n.status] || STATUS_COLORS.unknown;
  return AREA_COLORS[areas.indexOf(n.area) % AREA_COLORS.length];
}
function styleFor(n) {
  const fill = fillFor(n);
  const border = n.status === "unknown" ? "rgba(255,255,255,0.12)" : STATUS_COLORS[n.status];
  return {
    id: n.id, label: n.id, title: `${n.id}  [${n.area}]  ${n.status}\nneeds: ${n.needs || "nothing"}`,
    size: Math.min(6 + n.degree * 1.3, 24),
    color: { background: fill, border, highlight: { background: fill, border: "#ffffff" }, hover: { background: fill, border } },
    borderWidth: n.status === "unknown" ? 1 : 2.5,
    opacity: 1, hidden: !statusVisible(n.status),
    x: (positions[n.id] || { x: 0 }).x,
    y: (positions[n.id] || { y: 0 }).y,
    fixed: { x: true, y: true },
    font: { color: "#c8cdd6", size: 12 },
    scaling: { label: { enabled: true, min: 9, max: 22, drawThreshold: 4 } },
  };
}
function statusVisible(s) {
  return document.getElementById("f-" + (s === "unknown" ? "unknown" : s)).checked;
}
function applyAll() { nodes.update(raw.nodes.map(styleFor)); }

function dimTo(id) {
  if (route.active) return;
  const keep = new Set([id, ...net.getConnectedNodes(id)]);
  nodes.update(raw.nodes.map(n => ({ id: n.id, opacity: keep.has(n.id) ? 1 : DIM,
    font: { color: keep.has(n.id) ? "#F8FAFC" : "rgba(200,205,214,0.05)" } })));
  edges.update(raw.edges.map(e => ({ id: e.id,
    color: (e.from === id || e.to === id) ? { color: "rgba(255,255,255,0.5)" } : { color: "rgba(150,160,180,0.04)" } })));
}
function spotlightReady() {
  nodes.update(raw.nodes.map(n => ({ id: n.id, opacity: n.ready ? 1 : DIM,
    font: { color: n.ready ? "#F8FAFC" : "rgba(200,205,214,0.05)" } })));
  edges.update(raw.edges.map(e => ({ id: e.id, color: { color: "rgba(150,160,180,0.05)" } })));
}
function restore() {
  if (route.active) return;
  if (document.getElementById("f-ready").checked) { spotlightReady(); return; }
  nodes.update(raw.nodes.map(n => ({ id: n.id, opacity: 1, font: { color: "#c8cdd6" } })));
  edges.update(raw.edges.map(e => ({ id: e.id, color: { color: "rgba(150,160,180,0.14)" } })));
}
net.on("hoverNode", p => { if (route.active) { markRow(p.node, true); } else { dimTo(p.node); } });
net.on("blurNode", p => { if (route.active) { markRow(p.node, false); } else { restore(); } });
net.on("click", p => {
  if (route.active) { if (p.nodes.length && route.order.includes(p.nodes[0])) focusStep(route.order.indexOf(p.nodes[0])); return; }
  if (p.nodes.length) dimTo(p.nodes[0]); else restore();
});

function resolve(q) {
  q = q.trim().toLowerCase().replaceAll(" ", "-");
  if (raw.nodes.some(n => n.id === q)) return q;
  if (aliases[q] && raw.nodes.some(n => n.id === aliases[q])) return aliases[q];
  const hit = raw.nodes.find(n => n.id.includes(q));
  return hit ? hit.id : null;
}

// Route mode: a serpentine timeline. Order is the truth; layout obeys it.
const COLS = 8, DX = 210, DY = 170;
function serpentine(i) {
  const row = Math.floor(i / COLS), col = i % COLS;
  return { x: (row % 2 === 0 ? col : COLS - 1 - col) * DX, y: row * DY };
}

function routeTo(query) {
  const target = resolve(query);
  if (!target) { document.getElementById("counts").textContent = `not in map: ${query}`; return; }
  if (route.active) clearRoute(true);
  const parents = {};
  raw.edges.forEach(e => { (parents[e.to] = parents[e.to] || []).push(e.from); });
  const anc = new Set(); const stack = [target];
  while (stack.length) {
    const n = stack.pop();
    (parents[n] || []).forEach(p => { if (!anc.has(p)) { anc.add(p); stack.push(p); } });
  }
  const statusOf = Object.fromEntries(raw.nodes.map(n => [n.id, n.status]));
  const sub = new Set([...anc, target]);
  const toLearn = new Set([...sub].filter(id => statusOf[id] !== "known"));
  const knownCount = sub.size - toLearn.size;
  const indeg = {}, children = {};
  toLearn.forEach(id => indeg[id] = 0);
  raw.edges.forEach(e => {
    if (toLearn.has(e.from) && toLearn.has(e.to)) {
      (children[e.from] = children[e.from] || []).push(e.to);
      indeg[e.to]++;
    }
  });
  const queue = [...toLearn].filter(id => indeg[id] === 0).sort();
  const order = [];
  while (queue.length) {
    const n = queue.shift();
    order.push(n);
    (children[n] || []).forEach(c => { if (--indeg[c] === 0) queue.push(c); });
  }
  route = { active: true, order, target, cursor: -1, trail: [] };

  const inRoute = new Set(order);
  nodes.update(raw.nodes.map(n => {
    if (!inRoute.has(n.id)) return { id: n.id, hidden: true };
    const i = order.indexOf(n.id);
    const p = serpentine(i);
    const isTarget = n.id === target;
    const isStart = i === 0;
    const inProgress = n.status === "learning" || n.status === "shaky";
    return {
      id: n.id, hidden: false, opacity: 1, fixed: { x: true, y: true }, x: p.x, y: p.y,
      size: isTarget ? 15 : 11,
      label: `${i + 1}. ${n.id}`,
      title: `step ${i + 1} of ${order.length}: ${n.id}\nneeds: ${n.needs || "nothing"}`,
      font: { color: "#F8FAFC", size: 13 },
      scaling: { label: { enabled: true, min: 13, max: 13, drawThreshold: 1 } },
      color: {
        background: isTarget ? "#fbbf24" : "#1E293B",
        border: isTarget ? "#FFFFFF" : isStart ? "#4ade80" : inProgress ? "#fbbf24" : "rgba(248,250,252,0.28)",
        highlight: { background: isTarget ? "#fbbf24" : "#334155", border: "#FFFFFF" },
        hover: { background: isTarget ? "#fbbf24" : "#334155", border: "#FFFFFF" },
      },
      borderWidth: isTarget || isStart || inProgress ? 3 : 1.5,
    };
  }));
  edges.update(raw.edges.map(e => ({ id: e.id, hidden: true })));
  route.trail = order.slice(0, -1).map((id, i) => ({
    id: `route-${i}`, from: id, to: order[i + 1], physics: false, hidden: false,
    color: { color: "rgba(251,191,36,0.8)" }, width: 3, smooth: false,
    arrows: { to: { enabled: true, scaleFactor: 0.6 } },
  }));
  edges.add(route.trail);
  net.fit({ nodes: order, animation: ANIM });

  document.getElementById("route-head").innerHTML =
    `<span id="route-close" role="button" tabindex="0">✕</span>` +
    `<b>${order.length} teach-backs to ${target}</b><br>` +
    `<span class="muted">click a step to jump · arrows to walk · esc to close` +
    (knownCount ? ` · standing on ${knownCount} known` : "") + `</span>`;
  document.getElementById("route-steps").innerHTML = order.map((id, i) =>
    `<div class="step" data-i="${i}" tabindex="0"><span class="n">${i + 1}</span><span>${id}</span></div>`).join("");
  document.getElementById("route").style.display = "flex";
  const close = document.getElementById("route-close");
  close.onclick = () => clearRoute(false);
  close.onkeydown = e => { if (e.key === "Enter") clearRoute(false); };
  document.querySelectorAll("#route-steps .step").forEach(el => {
    el.onclick = () => focusStep(+el.dataset.i);
    el.onkeydown = e => { if (e.key === "Enter") focusStep(+el.dataset.i); };
  });
}

function focusStep(i) {
  if (!route.active || i < 0 || i >= route.order.length) return;
  route.cursor = i;
  const id = route.order[i];
  net.focus(id, { scale: 1.1, animation: ANIM });
  net.selectNodes([id]);
  document.querySelectorAll("#route-steps .step").forEach(el => {
    el.classList.toggle("current", +el.dataset.i === i);
    if (+el.dataset.i === i) el.scrollIntoView({ block: "nearest" });
  });
}
function markRow(id, on) {
  const i = route.order.indexOf(id);
  if (i < 0) return;
  const el = document.querySelector(`#route-steps .step[data-i="${i}"]`);
  if (el) { el.classList.toggle("hovered", on); if (on) el.scrollIntoView({ block: "nearest" }); }
}
function clearRoute(silent) {
  if (route.trail.length) edges.remove(route.trail.map(e => e.id));
  route = { active: false, order: [], target: null, cursor: -1, trail: [] };
  document.getElementById("route").style.display = "none";
  edges.update(raw.edges.map(e => ({ id: e.id, hidden: false, color: { color: "rgba(150,160,180,0.14)" } })));
  if (!silent) { applyAll(); restore(); net.fit({ animation: ANIM }); }
}

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (!route.active) return;
  if (e.key === "Escape") { clearRoute(false); }
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); focusStep(route.cursor + 1); }
  else if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); focusStep(Math.max(route.cursor - 1, 0)); }
});

document.getElementById("search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const v = e.target.value.trim();
  if (v.toLowerCase().startsWith("path:")) { routeTo(v.slice(5)); return; }
  const hit = resolve(v);
  if (hit && !route.active) { net.focus(hit, { scale: 1.4, animation: ANIM }); net.selectNodes([hit]); dimTo(hit); }
  else if (hit && route.active && route.order.includes(hit)) { focusStep(route.order.indexOf(hit)); }
});
document.querySelectorAll('input[name="cmode"]').forEach(r =>
  r.addEventListener("change", e => { cmode = e.target.value; if (!route.active) applyAll(); }));
["f-known", "f-learning", "f-shaky", "f-unknown"].forEach(fid =>
  document.getElementById(fid).addEventListener("change", () => { if (!route.active) applyAll(); }));
document.getElementById("f-ready").addEventListener("change", restore);

async function load(first) {
  try {
    const d = await (await fetch("/data")).json();
    areas = d.areas; aliases = d.aliases || {};
    if (first) {
      raw = d;
      positions = computePositions(d);
      nodes.add(d.nodes.map(styleFor));
      edges.add(d.edges);
      const want = new URLSearchParams(location.search).get("path");
      if (want) setTimeout(() => routeTo(want), 400);
      else net.fit({ animation: ANIM });
    } else if (!route.active) {
      raw = d;
      positions = computePositions(d);
      nodes.update(d.nodes.map(styleFor));
    }
    document.getElementById("counts").textContent =
      `${d.counts.nodes} concepts · ${d.counts.known} known · ${d.counts.learning} learning · ${d.counts.shaky} shaky · ${d.counts.ready} ready`;
    document.getElementById("live").style.background = "#4ade80";
  } catch { document.getElementById("live").style.background = "#f7768e"; }
}
load(true);
setInterval(() => load(false), 5000);
</script>
</body>
</html>
